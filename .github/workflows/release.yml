name: Build & Release APK

# Triggers on every push of a version tag (e.g. v1.0.0, v1.2.3)
# To release: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build Signed APK & Create Release
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java (must match your compileOptions — VERSION_17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      # 3. Make gradlew executable (needed on Linux runners)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Decode the keystore from the GitHub Secret and write it to disk
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      # 5. Build the signed release APK
      - name: Build signed release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/keystore.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.STORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      # 6. Locate the APK (path varies by module name)
      - name: Find APK path
        id: apk
        run: |
          APK_PATH=$(find . -name "*.apk" -path "*/release/*" | head -1)
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK at: $APK_PATH"

      # 7. Create a GitHub Release and upload the APK as an asset
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true # auto-fills release notes from commit messages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # built-in, no setup needed
